paths:
  resources_dir: inputs

experiment:
  name: baseline

optimization:
  solver: gurobi
  solver_fallbacks:
    - cbc
  tee: false

validation:
  strict: true
  min_rows_after_merge: 24

ex_ante:
  updates_per_year: 4

dynamic:
  block_mode: hour

battery:
  enabled: false
  capacity_kwh: 10.0
  power_kw: 5.0
  efficiency_charge: 0.95
  efficiency_discharge: 0.95
  initial_soc_fraction: 0
  replacement_cost_eur: 500.0
  lifecycle_cycles: 4000

io:
  csv:
    encoding: utf-8
    fallback_encoding: latin-1
    sep_primary: ","
    sep_fallback: ";"
  time:
    dayfirst: false
    utc: true
    floor: h
    drop_duplicates: true
  columns:
    time: ["Time", "time", "datetime"]
    pv: G_kWh
    buy: p_buy_eur_kwh
    sell: p_sell_eur_kwh
    consumption_prefix: cons_

logging:
  directory: logs
  level: INFO
  file_encoding: utf-8
